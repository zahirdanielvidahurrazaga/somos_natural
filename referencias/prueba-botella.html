<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Botella: antes y después</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root { --f: #C0D6FF; --t: #6D0101 }
  * { box-sizing: border-box; margin: 0 }
  body { font: 15px/1.3 Rubik, system-ui, sans-serif; background: var(--f); color: var(--t); min-height: 100svh; transition: background .5s }
  .lados { display: grid; grid-template-columns: 1fr 1fr; height: calc(100svh - 132px); min-height: 380px }
  .lado { position: relative; touch-action: none; cursor: grab }
  .lado:active { cursor: grabbing }
  .lado + .lado { border-left: 1px dashed color-mix(in srgb, var(--t) 35%, transparent) }
  .lado canvas { position: absolute; inset: 0; width: 100%; height: 100% }
  .lado b { position: absolute; top: 14px; left: 50%; translate: -50% 0; z-index: 2; background: var(--t); color: var(--f); padding: 6px 14px; border-radius: 99px; font-weight: 700; white-space: nowrap }
  .mando { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: center; padding: 12px 16px 16px }
  button, select, label.tog { font: inherit; border: 2px solid var(--t); background: transparent; color: var(--t); border-radius: 99px; padding: 7px 14px; cursor: pointer }
  label.tog { display: inline-flex; gap: 6px; align-items: center; user-select: none }
  label.tog:has(input:checked) { background: var(--t); color: var(--f) }
  label.tog input { display: none }
  .nombre { min-width: 9em; text-align: center; font-weight: 700 }
  .expo { display: inline-flex; gap: 8px; align-items: center }
  @media (max-width: 700px) { .lados { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; height: 70svh } .lado + .lado { border-left: 0; border-top: 1px dashed color-mix(in srgb, var(--t) 35%, transparent) } }
</style></head><body>
<div class="lados">
  <div class="lado" id="antes"><b>Hoy</b></div>
  <div class="lado" id="despues"><b>Propuesta</b></div>
</div>
<div class="mando">
  <button id="prev" aria-label="Sabor anterior">←</button>
  <span class="nombre" id="nombre">Jamaica</span>
  <button id="next" aria-label="Sabor siguiente">→</button>
  <label class="tog"><input type="checkbox" id="t-frio" checked />Gotas de frío</label>
  <label class="tog"><input type="checkbox" id="t-acostada" checked />Acostada (como en Nosotros)</label>
  <button id="sacude">Sacudir</button>
  <label class="tog"><input type="checkbox" id="t-gira" checked />Girar sola</label>
  <span class="expo">Brillo <input type="range" id="expo" min="0.6" max="1.4" step="0.02" value="1" /></span>
</div>
<script type="module" src="/src/referencias/prueba-botella.js"></script>
</body></html>
